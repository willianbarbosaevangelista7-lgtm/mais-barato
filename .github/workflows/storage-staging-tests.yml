name: Storage staging integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-staging:
    name: Supabase Storage authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Storage integration tests against staging only
        run: bun run test:storage
        env:
          SUPABASE_STORAGE_TEST_URL: ${{ secrets.SUPABASE_STORAGE_TEST_URL }}
          SUPABASE_STORAGE_TEST_ANON_KEY: ${{ secrets.SUPABASE_STORAGE_TEST_ANON_KEY }}
          SUPABASE_STORAGE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STORAGE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_TEST_EDITOR_EMAIL: ${{ secrets.SUPABASE_STORAGE_TEST_EDITOR_EMAIL }}
          SUPABASE_STORAGE_TEST_EDITOR_PASSWORD: ${{ secrets.SUPABASE_STORAGE_TEST_EDITOR_PASSWORD }}
          SUPABASE_STORAGE_TEST_MARKET_ID: ${{ secrets.SUPABASE_STORAGE_TEST_MARKET_ID }}
          SUPABASE_STORAGE_TEST_CUSTOMER_EMAIL: ${{ secrets.SUPABASE_STORAGE_TEST_CUSTOMER_EMAIL }}
          SUPABASE_STORAGE_TEST_CUSTOMER_PASSWORD: ${{ secrets.SUPABASE_STORAGE_TEST_CUSTOMER_PASSWORD }}
          SUPABASE_STORAGE_TEST_TARGET: staging
          SUPABASE_STORAGE_TEST_CONFIRM: I_UNDERSTAND_THIS_CREATES_AND_DELETES_TEST_DATA
