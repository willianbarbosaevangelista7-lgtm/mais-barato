name: SQL security tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "drizzle/migrations/**"
      - "supabase/**"
      - "scripts/test-security-db.sh"
      - ".github/workflows/security-sql-tests.yml"

permissions:
  contents: read

jobs:
  security-sql:
    name: Drizzle migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run database security tests
        run: bash scripts/test-security-db.sh
